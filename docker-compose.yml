# Local single-node OpenSearch for the gdpr-forget-me skill.
#
#   docker compose up -d --wait     start (and wait until the cluster answers)
#   docker compose stop             stop, keeping the index
#   docker compose down             remove the container, keeping the index
#   docker compose down -v          remove the index as well
#
# After the cluster is up, deploy the embedding model once per start:
#   uv run python scripts/forget_me.py setup
#
# ML Commons keeps the model registered across a restart but does not keep it
# deployed in memory, and discover falls back to BM25 when it is not. Running
# setup against the already-running container redeploys it and leaves the data
# alone.
#
# The container name matches the one the skill's own bootstrap looks for, so
# with this file in use the skill sees a running cluster and never tries to
# recreate it.

services:
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: gdpr-forget-me-os
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=myStrongPassword123!
      # The image default of 1Gb leaves heap above the ML Commons
      # jvm_heap_memory_threshold (85%), so inference is refused with a
      # circuit_breaking_exception. 3Gb deploys the model and ingests the
      # corpus comfortably.
      - OPENSEARCH_JAVA_OPTS=-Xms3g -Xmx3g
      - plugins.ml_commons.only_run_on_ml_node=false
      - plugins.ml_commons.allow_registering_model_via_url=true
      - plugins.ml_commons.native_memory_threshold=99
      - plugins.ml_commons.model_access_control_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      # A named volume, so the seeded corpus survives `docker compose down`.
      # The skill's own `docker run` bootstrap has no volume and keeps the
      # index in the container layer, where `setup` on a stopped container
      # destroys it.
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  opensearch-data:
